# ═══════════════════════════════════════════════════════════
# 开发用通用配置 fixture
# 入站端口不在这里定义 —— 由 manager.yaml 各模式的 preset 注入
# ═══════════════════════════════════════════════════════════

allow-lan: true
bind-address: '*'
mode: rule
log-level: info
ipv6: false
external-controller: 127.0.0.1:9090
unified-delay: true
tcp-concurrent: true
find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
    TLS:
      ports: [443, 8443]

dns:
  enable: true
  ipv6: false
  listen: 0.0.0.0:1053
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - '*.lan'
    - '*.local'
  default-nameserver:
    - 223.5.5.5
    - 119.29.29.29
  nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query

# 以下均为文档示例地址（TEST-NET-2），不指向真实服务
proxies:
  - name: "示例节点-香港"
    type: ss
    server: 198.51.100.10
    port: 8388
    cipher: aes-256-gcm
    password: "dev-fixture-only"
  - name: "示例节点-日本"
    type: ss
    server: 198.51.100.11
    port: 8388
    cipher: aes-256-gcm
    password: "dev-fixture-only"

proxy-groups:
  - name: PROXY
    type: select
    proxies:
      - 自动选择
      - 示例节点-香港
      - 示例节点-日本
      - DIRECT
  - name: 自动选择
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - 示例节点-香港
      - 示例节点-日本

rules:
  - GEOIP,lan,DIRECT,no-resolve
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
